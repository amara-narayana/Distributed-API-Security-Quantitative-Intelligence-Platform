version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: platform-db
    environment:
      POSTGRES_DB: security_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d security_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: platform-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/security_platform
      DB_USERNAME: admin
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-security-platform-bucket}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      FABRIC_CONFIG_PATH: /app/connection-profile.json
      IBKR_HOST: ${IBKR_HOST:-localhost}
      IBKR_PORT: ${IBKR_PORT:-4001}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./blockchain/connection-profile.json:/app/connection-profile.json:ro

  ai-agent:
    build: ./ai-agent
    container_name: platform-ai-agent
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_DB_PATH: /app/chroma_db
    ports:
      - "8001:8001"
    volumes:
      - ai_chroma_data:/app/chroma_db
    depends_on:
      - backend

  quant-module:
    build: ./quant-module
    container_name: platform-quant
    environment:
      DB_URL: jdbc:postgresql://db:5432/security_platform
      DB_USERNAME: admin
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      MODEL_PATH: /app/models/trading_model.pkl
    ports:
      - "8002:8002"
    depends_on:
      - db
    volumes:
      - quant_models:/app/models

  security-engine:
    build: ./security-engine
    container_name: platform-security-engine
    environment:
      BACKEND_URL: http://backend:8080
      AI_AGENT_URL: http://ai-agent:8001
    depends_on:
      - backend
      - ai-agent

  trading-broker:
    build: ./trading-broker
    container_name: platform-trading
    environment:
      DB_URL: jdbc:postgresql://db:5432/security_platform
      DB_USERNAME: admin
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      IBKR_HOST: ${IBKR_HOST:-host.docker.internal}
      IBKR_PORT: ${IBKR_PORT:-4001}
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}
      MAX_DAILY_LOSS_PCT: 2.0
      MAX_POSITION_SIZE_PCT: 10.0
    depends_on:
      - db
      - quant-module
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: Hyperledger Fabric Network
  ca:
    image: hyperledger/fabric-ca:latest
    container_name: fabric-ca
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-org1
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_TLS_CERTFILE: /etc/hyperledger/fabric-ca-server-tls/tlsca-cert.pem
      FABRIC_CA_SERVER_TLS_KEYFILE: /etc/hyperledger/fabric-ca-server-tls/tlsca-key.pem
    ports:
      - "7054:7054"
    volumes:
      - fabric_ca:/etc/hyperledger/fabric-ca-server
    profiles:
      - fabric

  orderer:
    image: hyperledger/fabric-orderer:latest
    container_name: fabric-orderer
    environment:
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_GENESISMETHOD: file
      ORDERER_GENERAL_GENESISFILE: /var/hyperledger/orderer/orderer.genesis.block
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/orderers
    ports:
      - "7050:7050"
    volumes:
      - fabric_orderer:/var/hyperledger/production/orderer
    profiles:
      - fabric

  peer0:
    image: hyperledger/fabric-peer:latest
    container_name: fabric-peer0
    environment:
      CORE_PEER_ID: peer0.org1.example.com
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.example.com:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
    ports:
      - "7051:7051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - fabric_peer:/var/hyperledger/production
    profiles:
      - fabric

volumes:
  postgres_data:
  ai_chroma_data:
  quant_models:
  fabric_ca:
  fabric_orderer:
  fabric_peer:

networks:
  default:
    name: platform-network
