spring:
  application:
    name: api-security-platform
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/security_platform}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production}
  expiration-ms: 86400000 # 24 hours

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET:security-platform-bucket}
    region: ${AWS_REGION:us-east-1}

fabric:
  config-path: ${FABRIC_CONFIG_PATH:./blockchain/connection-profile.json}
  network-id: ${FABRIC_NETWORK_ID:test-network}
  channel: audit-channel
  chaincode: audit-chaincode

ibkr:
  host: ${IBKR_HOST:localhost}
  port: ${IBKR_PORT:4001}
  client-id: ${IBKR_CLIENT_ID:1}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.platform: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG

---

spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  
logging:
  level:
    root: WARN
    com.platform: INFO
    org.springframework.security: WARN
